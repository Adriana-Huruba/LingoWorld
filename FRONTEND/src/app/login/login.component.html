<p>Please login to continue</p>
<div class="login-form">
    <p>Email: </p>
    <input type="text" [formControl]="Email" placeholder="example@gmail.com"/>

    <p>Password:</p>
    <input type="password" [formControl]="Password"/>

    <button>Login</button>
    
    <p> Or login with google</p>
   
    <button (click)="redirectToRegister()">No account? Click here </button> 

</div>
