<div class="homepage-container">
    @if (!showPlayer) {
        <div class="main-container">
            <h1>Custom session</h1>
            <p class="subtitle">
                Configure your session and the recommender system will find the best exercises for your level.
            </p>

            <div class="filter-form">
                <div class="filter-row">
                    <label>Topic</label>
                    <select [(ngModel)]="selectedTopic">
                        <option value="">Any topic</option>
                        @for (topic of topics; track topic) {
                            <option [value]="topic">{{ topic }}</option>
                        }
                    </select>
                </div>

                <div class="filter-row">
                    <label>Skill</label>
                    <select [(ngModel)]="selectedSkillType">
                        @for (skill of skillTypes; track skill.value) {
                            <option [value]="skill.value">{{ skill.label }}</option>
                        }
                    </select>
                </div>

                <div class="filter-row">
                    <label>Number of exercises</label>
                    <div class="count-options">
                        @for (n of countOptions; track n) {
                            <button class="count-btn"
                                [class.active]="selectedCount === n"
                                (click)="selectedCount = n">
                                {{ n }}
                            </button>
                        }
                    </div>
                </div>
            </div>

            <button (click)="startSession()" [disabled]="isLoading" class="btn-generate">
                {{ isLoading ? 'Loading...' : 'Start session' }}
            </button>

            @if(isLoading) {
                <div class="status-message loading">
                    <p>Finding the best exercises for you...</p>
                </div>
            }

            @if(errorMessage) {
                <div class="status-message error">
                    <p>{{ errorMessage }}</p>
                </div>
            }
        </div>
    } @else {
        <app-universal-player
            [preloadedExercises]="generatedQuestions"
            [title]="'Custom Session'"
            [mode]="QuizMode.GENERATOR"
            (closed)="onPlayerClosed()"
            (completed)="onPlayerCompleted($event)">
        </app-universal-player>
    }
</div>
