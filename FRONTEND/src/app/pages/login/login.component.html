<div class="container">
  <div class="card">
    <div class="header">
      <h2>Welcome!</h2>
      <p>Please sign in to continue</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="example@gmail.com"/>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Enter password"/>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Sign In</button>

      <div class="divider">
        <span>or</span>
      </div>
      
      <button type="button" class="btn-secondary">
        <img src="google-icon.svg" alt="Google Icon" class="google-icon"/>
        Sign in with Google
      </button>

      <div class="register-prompt">
        <span>Don't have an account?</span>
        <button type="button" class="btn-link" (click)="redirectToRegister()">Register here</button> 
      </div>
    </form>
  </div>
</div>
