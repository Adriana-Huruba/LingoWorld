<nav class="nav">
    <img src="logo.png" class="logo" alt="logo" (click)="NavigateToDashboard()">
    @if(authService.isLoggedIn())
    {
        <div class="nav-links">
            <button class="vocabulary" (click)="NavigateToVocabulary()">My vocabulary</button>
            <div class="user-dropdown">
                <button class="user-button" (click)="toggleUserDropdown($event)">
                    <img src="user-icon.svg" alt="user icon" class="user-icon">
                </button>
                @if(isUserDropdownOpen){
                    <div class="user-options">
                        <button (click)="NavigateToSettings()">Settings</button>
                        <button (click)="NavigateToProgres()">My progress</button>
                        <button (click)="logout()">Logout</button>
                    </div>
                }
            </div>

            <div class="language-dropdown">
                <button class="language-option" (click)="toggleDropdown($event)">
                    <img [src]="currentFlag" [alt]="currentLanguageName + ' flag'" class="flag-icon">
                </button>
                
                @if (isDropdownOpen){
                    <div class="other-languages">
                        @if (targetLanguage !== 'en'){
                            <button (click)="selectLanguage('en')">
                                <img src="uk-flag.svg" alt="English flag" class="flag-icon">
                            </button>
                        }
                        @if (targetLanguage !== 'ro'){
                            <button (click)="selectLanguage('ro')">
                                <img src="romania-flag.svg" alt="Romanian flag" class="flag-icon">
                            </button>
                        }
                        @if (targetLanguage !== 'fr'){
                            <button (click)="selectLanguage('fr')">
                                <img src="france-flag.svg" alt="French flag" class="flag-icon">
                            </button>
                        }
                        @if (targetLanguage !== 'es'){
                            <button (click)="selectLanguage('es')">
                                <img src="spain-flag.svg" alt="Spanish flag" class="flag-icon">
                            </button>
                        }
                    </div>
                }
            </div>
        </div>
    }
</nav>
