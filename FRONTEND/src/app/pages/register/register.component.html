<div class="container">
  <div class="card">
    <div class="header">
      <h2>Join Lingo World!</h2>      
      <p>Fill in the form below to register</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="form-wrapper">
        <div class="form-column left">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" formControlName="name" placeholder="John Smith" autocomplete="name">
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="example@gmail.com" autocomplete="email">
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password" placeholder="password123" autocomplete="new-password">
          </div>
        </div>
      
        <div class="form-column right">
          <div class="input-group">
            <label for="role">What is your Role?</label>
            <select id="role" formControlName="role" placeholder="Select your role...">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="adult_learner">Adult learner</option>
            </select>
          </div>

          <div class="language-options">
            <label>Native Language</label>
            <div class="radio-group">
              <label>
                <input type="radio" id="native_english" formControlName="native_language" value="english">
                English
              </label>
              
              <label>
                <input type="radio" id="native_romanian" formControlName="native_language" value="romanian">
                Romanian
              </label>

              <label>
                <input type="radio" id="native_spanish" formControlName="native_language" value="spanish">
                Spanish
              </label>

              <label>
                <input type="radio" id="native_french" formControlName="native_language" value="french">
                French
              </label>
            </div>
          </div>
          <div class="language-options">
            <label>Target Language</label>
            <div class="radio-group">
              <label>
                <input type="radio" id="target_english" formControlName="target_language" value="english">
                English
              </label>
              
              <label>
                <input type="radio" id="target_romanian" formControlName="target_language" value="romanian">
                Romanian
              </label>

              <label>
                <input type="radio" id="target_spanish" formControlName="target_language" value="spanish">
                Spanish
              </label>

              <label>
                <input type="radio" id="target_french" formControlName="target_language" value="french">
                French
              </label>
            </div>
          </div>

        </div>
      </div>

      <label class="checkbox-label">
          <input type="checkbox" />
          I agree to the terms and conditions (<a ref="link">GDPR</a>)
        </label>
      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid">Register</button>
    </form>

    <div class="register-prompt">
      <span>Do you already have an account?</span>
      <button type="button" class="btn-link" (click)="redirectToLogin()">Log in here</button> 
    </div>
  </div>

</div>
