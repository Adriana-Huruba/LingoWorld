<div class="container">
  <div class="card">
    <div class="header">
      <h2>Join Lingo World!</h2>      
      <p>Fill in the form below to register</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="form-wrapper">
        <div class="form-column left">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" formControlName="name" placeholder="John Smith">
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="example@gmail.com">
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password" placeholder="password123">
          </div>
        </div>
      
        <div class="form-column right">
          <div class="input-group">
            <label for="role">What is your Role?</label>
            <select id="role" formControlName="role" placeholder="Select your role...">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="adult_learner">Adult Learner</option>
            </select>
          </div>

          <div class="language-options">
            <label for="language">Language</label>
            <div class="radio-group">
              <label>
                <input type="radio" id="language" formControlName="language" value="english">
                English
              </label>
              
              <label>
                <input type="radio" id="romanian" formControlName="language" value="romanian">
                Romanian
              </label>

              <label>
                <input type="radio" id="spanish" formControlName="language" value="spanish">
                Spanish
              </label>

              <label>
                <input type="radio" id="french" formControlName="language" value="french">
                French
              </label>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="btn-primary" [disabled]="registerForm.invalid">Register</button>
    </form>

    <div class="register-prompt">
      <span>Do you already have an account?</span>
      <button type="button" class="btn-link" (click)="redirectToLogin()">Log in here</button> 
    </div>
  </div>

</div>
