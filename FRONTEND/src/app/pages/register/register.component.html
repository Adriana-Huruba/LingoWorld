<h2>Fill in the form below to register</h2>
<div class="register-container">
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    
    <div>
      <label>Name:</label>
      <input type="text" formControlName="name" placeholder="John Smith">
    </div>

    <div>
      <label>Email:</label>
      <input type="email" formControlName="email" placeholder="example@gmail.com">
    </div>

    <div>
      <label>Role:</label>
      <select formControlName="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="adult">Adult</option>
      </select>
    </div>

    <div>
      <label>Language:</label>
      <div class="radio-group">
        <label>
          <input type="radio" formControlName="language" value="english">
          English
        </label>
        
        <label>
          <input type="radio" formControlName="language" value="romanian">
          Romanian
        </label>

        <label>
          <input type="radio" formControlName="language" value="spanish">
          Spanish
        </label>

        <label>
          <input type="radio" formControlName="language" value="french">
          French
        </label>
      </div>
    </div>

    <div>
      <label>Password:</label>
      <input type="password" formControlName="password" placeholder="password123">
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Register</button>
  </form>
  
  <p>Do you already have an account? <a (click)="redirectToLogin()">Log in here</a></p>
</div>
