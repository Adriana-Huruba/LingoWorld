<div class="teacher-dashboard-container">
    <h2>Welcome, teacher {{teacher()?.name}}!</h2>
    <div class="search-bar">
        <input nz-input placeholder="Search for a class/student..." [(ngModel)]="searchText" (input)="filterText()" />
        <button> 
            <nz-icon nzType="search" nzTheme="outline" />
        </button>
    </div>
    <p>Your classes:</p>
    <div class="classroom-grid">
        @for(classroom of classrooms; track classroom.id) 
        {
            <div class="classroom-card" (click)="navigateToClassroom(classroom.id)">
                <button class="classroom-button">
                    <img src="classroom.svg" alt="Classroom icon" class="classroom-icon">
                </button>
                <h3>{{ classroom.name }}</h3>
                <nz-icon nzType="team" /> 
        <span class="student-badge">{{ classroom.student_count || 0 }} students</span>
            </div>
        }
    </div>
    <button nz-button nzType="primary" (click)="showModal()" class="add-class-btn">
        Add new class
    </button>

    <nz-modal [(nzVisible)]="isModalVisible" nzTitle="Create new class" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
        <ng-container *nzModalContent>
            <input nz-input placeholder="Class name (ex: English Grade 10B)" [(ngModel)]="newClassName" />
        </ng-container>
    </nz-modal>
</div>
