<div class="voice-assistant-container">
    <app-navbar-voice></app-navbar-voice>
    <div class="content">
        <p>Hi! I'm your voice-assistant. Record your voice and I'll check your pronunciation</p>

        <button class="gen-phrase-btn">
            Generate a phrase
        </button>
        <p>Generated text: </p>
        <button class="upload-audio-btn">
            Upload an audio file
        </button>
        <p>Or Register an audio:</p>
        <img src="mic-icon.svg" alt="mic icon" class="mic-icon">
        <div class="buttons"> 
            <button (click)="toggleRecording()">Start Recording</button>
            <button>Stop Recording</button>
        </div>
    </div>
    
</div>
